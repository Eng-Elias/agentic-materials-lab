name: literature_agent
instructions: ../../agents/literature.md
executor:
  harness: claude-sdk
  model: databricks-claude-sonnet-4-6
  auth:
    type: databricks
    profile: oss
os_env:
  type: caller_process
  cwd: ../../
  sandbox:
    type: none
tools:
  search_lit:
    type: function
    description: search_lit(query, per_page)
    callable: src.tools_api.search_lit
    parameters:
      type: object
      properties:
        query:
          type: string
        per_page:
          type: integer
          default: 5
      required:
      - query
policies:
  permissions:
    type: function
    handler: src.permissions.make_permission_policy
    factory_params:
      agent: literature
